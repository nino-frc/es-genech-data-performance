name: ES Genech - Data & Performance Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 17 * * 5'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Installation du navigateur Playwright
        run: |
          playwright install chromium --with-deps

      - name: ⚽ 1. Scraping des résultats & feuilles de match ES Genech
        run: |
          python scraper.py

      - name: 🕵️ 2. Espionnage & Scouting tactique de l'adversaire
        run: |
          python scout_opponent.py

      - name: 📊 3. Calculs statistiques & exports Power BI
        run: |
          python analytics.py

      - name: 🎲 4. Simulation Monte-Carlo & Projections R3
        run: |
          python simulateur_monte_carlo.py

      - name: 📱 5. Génération automatique de la fiche d'avant-match mobile (PNG & PDF)
        run: |
          python generate_match_briefing.py

      - name: 💾 6. Sauvegarde automatique des données & livrables sur GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-Update : Données, Scouting Adversaire, Monte-Carlo et Briefing actualisés"
          file_pattern: "genech_performance.db exports_powerbi/* briefings_coach/*"

      - name: 📤 7. Archivage sécurisé du briefing (Téléchargeable, aucun envoi externe)
        uses: actions/upload-artifact@v4
        with:
          name: briefing-matchday-es-genech
          path: |
            briefings_coach/*.png
            briefings_coach/*.pdf
