name: ES Genech - Data & Performance Pipeline

on:
  workflow_dispatch:
  schedule:
    # Lundi : Déclenchement à 05h25 UTC (06h25 heure de Paris)
    # Minute atypique (:25) pour contourner la congestion des files d'attente GitHub
    # Garantit une réception par e-mail au staff dès le réveil (07h00 - 08h00)
    - cron: '25 5 * * 1'

    # Vendredi : Déclenchement à 10h20 UTC (11h20 heure de Paris)
    # Permet au coach de recevoir le briefing tactique pour le déjeuner (12h00)
    # bien avant la séance et la causerie du vendredi soir
    - cron: '20 10 * * 5'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Installation du navigateur Playwright
        run: |
          playwright install chromium --with-deps

      - name: ⚽ 1. Scraping des résultats & feuilles de match FFF (Senior A)
        run: |
          python scraper.py

      - name: 🕵️ 2. Espionnage & Scouting tactique de l'adversaire
        run: |
          python scout_opponent.py

      - name: 📊 3. Calculs statistiques & Analytics
        run: |
          python analytics.py

      - name: ⚖️ 4. Veille Disciplinaire Interne (Art. 226 FFF & Gestion Sursis)
        run: |
          python discipline_monitor.py

      - name: 🏆 5. Notation Joueur & ESG Impact Scores (0-100)
        run: |
          python player_rating.py

      - name: 📈 6. Analyse des Facteurs Clés de Victoire
        run: |
          python performance_drivers.py

      - name: 🔄 7. Matrice d'Impact des Remplaçants (Plus/Minus +/-)
        run: |
          python substitutions_impact.py

      - name: 🎲 8. Simulation Monte-Carlo & Projections R3 (20 000 itérations)
        run: |
          python simulateur_monte_carlo.py

      - name: 📱 9. Génération du Briefing d'Avant-Match (Senior A)
        run: |
          python generate_match_briefing.py

      - name: 📋 10. Génération du Débrief Post-Match du Lundi (Senior A)
        run: |
          python generate_postmatch_debrief.py

      - name: 📇 11. Génération des Cartes Profil Joueurs (FM / FIFA)
        run: |
          python generate_player_cards.py

      - name: 👔 12. Génération du Rapport Exécutif Mensuel (Président & Comité)
        run: |
          python generate_executive_report.py

      - name: 📧 13. Envoi automatique des livrables par e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python send_email_report.py

      - name: 📤 14. Archivage sécurisé des livrables (Artifacts GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: livrables-es-genech
          path: |
            briefings_coach/*.pdf
            briefings_coach/*.png
          retention-days: 14

      - name: 💾 15. Sauvegarde & Commit automatique de la Base de Données
        run: |
          git config user.name "Genech Analytics Bot"
          git config user.email "bot@esgenech.fr"
          git add genech_performance.db exports_powerbi/ briefings_coach/
          git diff-index --quiet HEAD || git commit -m "chore(auto): mise à jour hebdomadaire des données et livrables FFF [skip ci]"
          git push origin main
