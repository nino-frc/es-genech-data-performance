name: ES Genech - Data & Performance Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'   # Lundi à 08h00 UTC (10h00 Paris) : Débrief Post-Match, Cartes Joueurs, Rapport Board & Prédictions
    - cron: '0 16 * * 5'  # Vendredi à 16h00 UTC (18h00 Paris) : Briefing d'Avant-Match, Météo & Scouting

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Installation du navigateur Playwright
        run: |
          playwright install chromium --with-deps

      - name: ⚽ 1. Scraping des résultats & feuilles de match FFF
        run: |
          python scraper.py

      - name: 🕵️ 2. Espionnage & Scouting tactique de l'adversaire
        run: |
          python scout_opponent.py

      - name: 📊 3. Calculs statistiques & Analytics
        run: |
          python analytics.py

      - name: ⚖️ 4. Veille Disciplinaire Interne (Art. 226 FFF & Gestion Sursis)
        run: |
          python discipline_monitor.py

      - name: 🏆 5. Notation Joueur & ESG Impact Scores (0-100)
        run: |
          python player_rating.py

      - name: 📈 6. Analyse des Facteurs Clés de Victoire
        run: |
          python performance_drivers.py

      - name: 🔄 7. Matrice d'Impact des Remplaçants (Plus/Minus +/-)
        run: |
          python substitutions_impact.py

      - name: 🎲 8. Simulation Monte-Carlo & Projections R3 (20 000 itérations)
        run: |
          python simulateur_monte_carlo.py

      - name: 📱 9. Génération du Briefing d'Avant-Match (Météo, Arbitre, Scouting)
        run: |
          python generate_match_briefing.py

      - name: 📋 10. Génération du Débrief Post-Match du Lundi (Timeline 90')
        run: |
          python generate_postmatch_debrief.py

      - name: 📇 11. Génération des Cartes Profil Joueurs (FM / FIFA)
        run: |
          python generate_player_cards.py

      - name: 👔 12. Génération du Rapport Exécutif Mensuel (Président & Comité)
        run: |
          python generate_executive_report.py

      - name: 📧 13. Envoi automatique des livrables par e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python send_email_report.py

      - name: 📤 14. Archivage sécurisé des livrables (Téléchargeable, aucun envoi externe)
        uses: actions/upload-artifact@v4
        with:
          name: livrables-es-genech
          path: |
            briefings_coach/*.png
            briefings_coach/*.pdf

      - name: 💾 15. Sauvegarde automatique sur GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genech_performance.db exports_powerbi/* briefings_coach/*
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-Update : Données, Scouting, Météo, Arbitre, Ratings & Rapports Comité actualisés"
            git pull --rebase origin main
            git push origin main
          else
            echo "Aucune modification à sauvegarder."
          fi
