name: MatchDay - Multi-Club Data & Performance Pipeline

on:
  workflow_dispatch:
  schedule:
    # Lundi : Déclenchement à 05h35 UTC (06h35 heure de Paris en hiver UTC+1)
    # Minute atypique (:35) pour contourner la congestion des files d'attente GitHub
    # Récupération des feuilles de match FFF du dimanche et débriefing prêt dès 07h00 pour le réveil du staff
    - cron: '35 5 * * 1'

    # Jeudi : Déclenchement à 05h35 UTC (06h35 heure de Paris en hiver UTC+1)
    # Permet au coach de recevoir le briefing tactique & scouting adverse dès le jeudi matin
    # après la publication des désignations et avant les séances d'entraînement de fin de semaine
    - cron: '35 5 * * 4'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Installation du navigateur Playwright
        run: |
          playwright install chromium --with-deps

      # --- 1. SCRAPING MULTI-CLUBS (FFF OFFICIEL) ---
      - name: ⚽ 1a. Scraping FFF ES Genech (525674)
        run: |
          python scraper.py
        continue-on-error: true

      - name: ⚽ 1b. Scraping FFF FC Seclin (500934)
        run: |
          python scrape_seclin_r2.py
        continue-on-error: true

      - name: ⚽ 1c. Scraping FFF US Lesquin (500426)
        run: |
          python scrape_lesquin_r2.py
        continue-on-error: true

      # --- 2. ANALYTICS & VEILLE DISCIPLINAIRE ---
      - name: 🕵️ 2. Espionnage & Scouting tactique de l'adversaire
        run: |
          python scout_opponent.py
        continue-on-error: true

      - name: 📊 3. Calculs statistiques & Analytics
        run: |
          python analytics.py
        continue-on-error: true

      - name: ⚖️ 4. Veille Disciplinaire Interne (Art. 226 FFF & Gestion Sursis)
        run: |
          python discipline_monitor.py
        continue-on-error: true

      - name: 🏆 5. Notation Joueur & ESG Impact Scores (0-100)
        run: |
          python player_rating.py
        continue-on-error: true

      - name: 📈 6. Analyse des Facteurs Clés de Victoire
        run: |
          python performance_drivers.py
        continue-on-error: true

      - name: 🔄 7. Matrice d'Impact des Remplaçants (Plus/Minus +/-)
        run: |
          python substitutions_impact.py
        continue-on-error: true

      - name: 🎲 8. Simulation Monte-Carlo & Projections R3 (20 000 itérations)
        run: |
          python simulateur_monte_carlo.py
        continue-on-error: true

      # --- 3. GÉNÉRATION DES DOCUMENTS DEBRIEF & BRIEFINGS ---
      - name: 📱 9. Génération du Briefing d'Avant-Match (Senior A)
        run: |
          python generate_match_briefing.py
        continue-on-error: true

      - name: 📋 10. Génération du Débrief Post-Match du Lundi (Senior A)
        run: |
          python generate_postmatch_debrief.py
        continue-on-error: true

      - name: 📇 11. Génération des Cartes Profil Joueurs (FM / FIFA)
        run: |
          python generate_player_cards.py
        continue-on-error: true

      - name: 👔 12. Génération du Rapport Exécutif Mensuel (Président & Comité)
        run: |
          python generate_executive_report.py
        continue-on-error: true

      # --- 4. EXPORT DES FLUX MULTI-CLUBS DE L'APPLICATION PWA ---
      - name: 🚀 13. Compilation et Export du flux PWA MatchDay (Genech, Seclin, Lesquin)
        run: |
          python export_pwa_feed.py

      # --- 5. ENVOI E-MAIL LIVRABLES ---
      - name: 📧 14. Envoi automatique des livrables par e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python send_email_report.py
        continue-on-error: true

      - name: 📤 15. Archivage sécurisé des livrables (Artifacts GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: livrables-matchday
          path: |
            briefings_coach/*.pdf
            briefings_coach/*.png
          retention-days: 14

      # --- 6. SAUVEGARDE & DÉPLOIEMENT AUTOMATIQUE NETLIFY ---
      - name: 💾 16. Sauvegarde & Commit automatique Multi-Clubs (Déclenche le build Netlify)
        run: |
          git config user.name "MatchDay Analytics Bot"
          git config user.email "bot@matchday-app.fr"
          git add genech_performance.db seclin_performance.db lesquin_performance.db public/data.js public/data_feed.json exports_powerbi/ briefings_coach/
          git diff-index --quiet HEAD || git commit -m "chore(auto): mise à jour hebdomadaire multi-clubs FFF (Genech, Seclin, Lesquin) [skip ci]"
          git push origin main
